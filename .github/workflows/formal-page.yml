name: formal-page

# Keeps web/formal.html's machine-checkable parts honest. A lightweight poll
# notices a new opencsv-formal default-branch commit within 15 minutes; only a
# changed source revision pays for the Lean build and publication. A weekly
# forced rebuild remains as an integrity backstop. Every publication still
# requires lake build + the axiom-audit gate.

on:
  schedule:
    - cron: "*/15 * * * *" # low-cost freshness check
    - cron: "41 5 * * 2"   # weekly forced rebuild
  repository_dispatch:
    types: [formal-main-green]
  workflow_dispatch:

concurrency:
  group: formal-page-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # the site repo (this one)

      - name: Check out opencsv-formal
        uses: actions/checkout@v4
        with:
          repository: opencsvnet/opencsv-formal
          path: formal

      - name: Detect a new verified-source candidate
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          FORMAL_SHA="$(git -C formal rev-parse --short HEAD)"
          PUBLISHED_SHA="$(sed -n 's/.*GEN-PROVENANCE.*opencsv-formal@\([0-9a-f][0-9a-f]*\).*GEN-PROVENANCE.*/\1/p' web/formal.html | head -n 1)"
          FORCE=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "repository_dispatch" ]]; then
            FORCE=true
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "41 5 * * 2" ]]; then
            FORCE=true
          fi

          if [[ -z "$PUBLISHED_SHA" ]]; then
            echo "published provenance is missing; forcing the fail-closed rebuild"
            FORCE=true
          fi

          if [[ "$FORCE" == "true" || "$FORMAL_SHA" != "$PUBLISHED_SHA" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "candidate opencsv-formal@$FORMAL_SHA (published: ${PUBLISHED_SHA:-missing})"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "already current at opencsv-formal@$FORMAL_SHA"
          fi

      - name: Install elan and build the Lean project (publish gate)
        if: steps.freshness.outputs.should_run == 'true'
        working-directory: formal
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake build
          scripts/axiom-audit.sh   # gate: baseline must match the build

      - name: Generate the axiom table fragment
        if: steps.freshness.outputs.should_run == 'true'
        working-directory: formal
        run: python3 scripts/gen-axiom-table.py --output "$RUNNER_TEMP/axiom-table.html"

      - name: Inject the fragment into web/formal.html
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python3 - <<'EOF'
          import os
          from pathlib import Path

          page = Path("web/formal.html")
          text = page.read_text()
          begin = "<!-- GEN-AXIOM-TABLE:BEGIN -->"
          end = "<!-- GEN-AXIOM-TABLE:END -->"
          if begin not in text or end not in text:
              raise SystemExit(
                  "error: GEN-AXIOM-TABLE markers missing from web/formal.html — "
                  "refusing to publish (add the markers or fix the page)"
              )
          fragment = Path(os.environ["RUNNER_TEMP"], "axiom-table.html").read_text().strip()
          pre, rest = text.split(begin, 1)
          _, post = rest.split(end, 1)
          page.write_text(pre + begin + "\n" + fragment + "\n" + end + post)
          print("injected axiom table into web/formal.html")
          EOF

      - name: Stamp provenance
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          grep -q '<!-- GEN-PROVENANCE -->' web/formal.html || { echo "error: GEN-PROVENANCE marker missing from web/formal.html"; exit 1; }
          SHA=$(git -C formal rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s/<!-- GEN-PROVENANCE -->.*<!-- \/GEN-PROVENANCE -->/<!-- GEN-PROVENANCE -->regenerated ${DATE} · build green · opencsv-formal@${SHA}<!-- \/GEN-PROVENANCE -->/" web/formal.html

      - name: Commit and push if changed
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          git config user.name "opencsv-bot"
          git config user.email "bot@opencsvnet.github.io"
          git add web/formal.html
          if git diff --cached --quiet; then
            echo "formal page unchanged"
          else
            git commit -m "formal: regenerate axiom table (opencsv-formal@$(git -C formal rev-parse --short HEAD))"
            git push
          fi
