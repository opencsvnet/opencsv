name: formal-page

# Keeps both machine-checkable proof layers honest. The public tables are
# regenerated only after the model and translated-Rust projects build, reject
# unfinished proofs, and match their checked axiom baselines.

on:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/formal-page.yml
      - scripts/render-formal-page.py
      - web/formal.html

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # the site repo (this one)

      - name: Check out the specification proofs
        uses: actions/checkout@v4
        with:
          repository: opencsvnet/opencsv-formal
          path: formal

      - name: Check out the translated-Rust refinement proofs
        uses: actions/checkout@v4
        with:
          repository: opencsvnet/formal-aeneas
          path: formal-aeneas

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject unfinished proofs
        run: |
          if grep -R --line-number --include='*.lean' --exclude-dir=.lake \
              -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              formal formal-aeneas; then
            echo "unfinished Lean proof found" >&2
            exit 1
          fi

      - name: Build and audit the specification proofs
        working-directory: formal
        run: |
          lake build
          bash scripts/axiom-audit.sh

      - name: Restore translated-Rust dependencies
        working-directory: formal-aeneas
        run: lake exe cache get

      - name: Build and audit the translated-Rust proofs
        working-directory: formal-aeneas
        run: |
          lake build
          bash scripts/axiom-audit.sh

      - name: Generate both audit fragments
        run: |
          python3 formal/scripts/gen-axiom-table.py \
            --output "$RUNNER_TEMP/model-axiom-table.html"
          python3 formal-aeneas/scripts/gen-axiom-table.py \
            --output "$RUNNER_TEMP/aeneas-axiom-table.html"

      - name: Render the public formal page
        run: |
          python3 scripts/render-formal-page.py \
            --page web/formal.html \
            --model-fragment "$RUNNER_TEMP/model-axiom-table.html" \
            --aeneas-fragment "$RUNNER_TEMP/aeneas-axiom-table.html" \
            --model-sha "$(git -C formal rev-parse --short HEAD)" \
            --aeneas-sha "$(git -C formal-aeneas rev-parse --short HEAD)" \
            --output web/formal.html

      - name: Upload the public-page receipt
        uses: actions/upload-artifact@v4
        with:
          name: formal-page-audits-${{ github.sha }}
          path: |
            ${{ runner.temp }}/model-axiom-table.html
            ${{ runner.temp }}/aeneas-axiom-table.html
            formal/axiom-audit.txt
            formal/lean-toolchain
            formal-aeneas/axiom-audit.txt
            formal-aeneas/lake-manifest.json
            formal-aeneas/lean-toolchain
            web/formal.html
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "opencsv-bot"
          git config user.email "bot@opencsvnet.github.io"
          git add web/formal.html
          if git diff --cached --quiet; then
            echo "formal page unchanged"
          else
            MODEL_SHA=$(git -C formal rev-parse --short HEAD)
            AENEAS_SHA=$(git -C formal-aeneas rev-parse --short HEAD)
            git commit -m "formal: regenerate audits (${MODEL_SHA}, ${AENEAS_SHA})"
            git push
          fi
