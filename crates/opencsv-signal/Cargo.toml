[package]
name = "opencsv-signal"
description = "Signal transport for OpenCSV consignments: links as a secondary device via presage and moves consignment blobs as attachments"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# presage is not published on crates.io (the `presage` name there is an
# unrelated crate), so we pin the upstream git revision. See README.md.
presage = { git = "https://github.com/whisperfish/presage", rev = "f74b96e0fb9099ce8be2b28b7ca9d11f78a6faea" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "f74b96e0fb9099ce8be2b28b7ca9d11f78a6faea" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "time", "signal"] }
qr2term = "0.3"
